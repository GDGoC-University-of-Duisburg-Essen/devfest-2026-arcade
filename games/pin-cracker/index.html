<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIN Cracker // DevFest 2026</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="wrap">
    <header>
      <h1 class="glitch" data-text="PIN CRACKER">PIN CRACKER</h1>
      <p class="intro">
        A sloppy smart lock leaks which digits you got right.
        Crack the <strong>4-digit PIN</strong> in <strong>8 attempts</strong>.
      </p>
      <ul class="legend">
        <li><span class="cell hit">7</span> right digit, right spot</li>
        <li><span class="cell near">7</span> in the PIN, wrong spot</li>
        <li><span class="cell miss">7</span> not in the PIN</li>
      </ul>
    </header>

    <section id="board" class="board" aria-label="Attempts"></section>

    <section class="controls">
      <div class="keypad" id="keypad" aria-label="Keypad"></div>
      <p id="msg" class="msg" aria-live="polite">&gt; type digits, press Enter to submit_</p>
    </section>
  </main>

  <div id="result" class="result" hidden>
    <div class="result-box">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <p class="lesson" id="lesson"></p>
      <div class="actions">
        <button class="btn" id="again">Play again</button>
        <button class="btn" id="exit">Launcher</button>
      </div>
      <p class="hint"><kbd>Enter</kbd> play again · <kbd>Esc</kbd> launcher</p>
    </div>
  </div>

  <script src="../../shared/kiosk.js" data-idle="120"></script>
  <script src="game.js"></script>
</body>
</html>
