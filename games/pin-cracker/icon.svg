<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PIN Cracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1f27"/>
      <stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ef0ff"/>
      <stop offset="1" stop-color="#39ff88"/>
    </linearGradient>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#3ef0ff" stroke-opacity=".09"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <rect width="128" height="128" rx="22" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="20.5" fill="none" stroke="#39ff88" stroke-opacity=".3" stroke-width="2"/>

  <!-- HUD corners -->
  <g fill="none" stroke="#3ef0ff" stroke-width="2.5" stroke-opacity=".7" stroke-linecap="round">
    <path d="M14 26V14h12"/><path d="M114 26V14h-12"/>
    <path d="M14 102v12h12"/><path d="M114 102v12h-12"/>
  </g>

  <!-- open shackle -->
  <path d="M42 58V44a22 22 0 0 1 44 0v2" fill="none" stroke="url(#neon)" stroke-width="8"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- lock body -->
  <rect x="25" y="56" width="78" height="50" rx="9" fill="#0a1419" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>

  <!-- PIN cells: hit, near, hit, hit -->
  <g font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="bold"
     text-anchor="middle" fill="#04070a">
    <rect x="31" y="71" width="14" height="20" rx="3" fill="#39ff88"/><text x="38" y="86">4</text>
    <rect x="49" y="71" width="14" height="20" rx="3" fill="#ffc94a"/><text x="56" y="86">0</text>
    <rect x="67" y="71" width="14" height="20" rx="3" fill="#39ff88"/><text x="74" y="86">9</text>
    <rect x="85" y="71" width="14" height="20" rx="3" fill="#1d2a30"/><text x="92" y="86" fill="#5f8a78">_</text>
  </g>
</svg>
